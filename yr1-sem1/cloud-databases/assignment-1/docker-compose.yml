services:
  mysql:
    image: mysql:8.4
    container_name: cabd_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: football
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/sql:ro
      - mysql_data:/var/lib/mysql
    command:
      - --sql_mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,ONLY_FULL_GROUP_BY,ERROR_FOR_DIVISION_BY_ZERO
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
